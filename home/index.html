    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #d1e8f5 25%, #c5dff0 50%, #b8d4eb 75%, #a8cae6 100%);
            color: #0f172a;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .navbar {
            position: relative;
            width: min(1600px, calc(100% - 48px));
            min-height: 80px;
            margin: 24px auto 32px;
            padding: 0 28px;
            background: rgba(255, 255, 255, 0.82);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow:
                0 8px 32px rgba(30, 58, 138, 0.08),
                0 2px 8px rgba(30, 58, 138, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-sizing: border-box;
            overflow: visible;
            z-index: 100;
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .brand-mark {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            padding-right: 20px;
            margin-right: 8px;
            border-right: 1px solid rgba(148, 163, 184, 0.2);
        }
        .brand-mark img {
            height: 48px;
            width: auto;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .brand-mark:hover img {
            transform: scale(1.05) rotate(-2deg);
        }
        .brand-name {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-link {
            color: #334155;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            position: relative;
            letter-spacing: -0.01em;
        }
        .nav-link::before {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 20px;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            border-radius: 2px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-link:hover {
            color: #1e40af;
            background: rgba(59, 130, 246, 0.06);
        }
        .nav-link:hover::before {
            transform: translateX(-50%) scaleX(1);
        }
        .dropdown {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .dropdown > button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            cursor: pointer;
            font: inherit;
            background: transparent;
            color: #334155;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.01em;
        }
        .dropdown > button::before {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 20px;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            border-radius: 2px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dropdown:hover > button {
            color: #1e40af;
            background: rgba(59, 130, 246, 0.06);
        }
        .dropdown:hover > button::before {
            transform: translateX(-50%) scaleX(1);
        }
        .navbar {
            position: relative;
            width: min(1800px, calc(100% - 32px));
            min-height: 88px;
            margin: 18px auto 24px;
            padding: 0 22px;
            background: rgba(255, 255, 255, 0.94);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(130, 171, 208, 0.35);
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(32, 74, 120, 0.16);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            overflow: visible;
            z-index: 20;
        }
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }
        .brand-mark {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .brand-mark img {
            height: 58px;
            width: auto;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #0e3b66;
        }
        .nav-link {
            color: #1b3550;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
            background: transparent;
        }
        .nav-link:hover {
            background: #eef6ff;
            color: #0b57d0;
            transform: translateY(-1px);
        }
        .dropdown {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding-bottom: 8px;
        }
        .dropdown > button {
            position: relative;
            top: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            font: inherit;
            height: 44px;
            box-sizing: border-box;
        }
        .dropdown-content {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-8px);
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            min-width: 220px;
            background: white;
            border: 1px solid #dbe7f3;
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(20, 40, 80, 0.18);
            padding: 10px;
            z-index: 9999;
            transition: opacity 0.05s ease, visibility 0.05s ease, transform 0.05s ease;
        }
        .dropdown-content::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            background: transparent;
        }
        .dropdown-content a {
            display: block;
            padding: 12px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: #1f2937;
            font-weight: 600;
            position: relative;
        }
        .dropdown-content a::after {
            content: '→';
            position: absolute;
            right: 12px;
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.2s ease;
        }
        .dropdown-content a:hover {
            background-color: #eef6ff;
            color: #0b57d0;
            padding-left: 20px;
        }
        .dropdown-content a:hover::after {
            opacity: 1;
            transform: translateX(0);
        }
        .dropdown:hover > .dropdown-content {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
            transition-delay: 0s;
        }
        .dropdown-content .dropdown {
            position: relative;
        }
        .dropdown-content .dropdown-content {
            opacity: 0; visibility: hidden; transform: translateX(-8px);
            position: absolute; top: 0; left: 100%; min-width: 200px;
            background: white; border: 1px solid #dbe7f3;
            border-radius: 16px; box-shadow: 0 18px 40px rgba(20, 40, 80, 0.18);
            padding: 10px; z-index: 9999;
            transition: none;
        }

        .dropdown-content .dropdown > a::before {
            content: ''; position: absolute; top: 0; left: 100%; width: 8px; height: 100%; background: transparent;
        }
        .dropdown-content .dropdown::after {
            content: '';
            position: absolute;
            top: 0;
            left: 100%;
            width: 8px;
            height: 100%;
            background: transparent;
        }
        .dropdown-content .dropdown:hover > .dropdown-content {
            opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(0); transition-delay: 0s;
        }
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 44px;
            height: 44px;
            padding: 0 14px;
            background: linear-gradient(135deg, #1787ff, #0a5dd8);
            color: white;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 22px rgba(23, 135, 255, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(23, 135, 255, 0.32);
            filter: brightness(1.02);
        }
        .slider {
            position: relative;
            width: 1500px;
            max-width: calc(100% - 32px);
            height: 500px;
            margin: 30px auto;
            overflow: hidden;
            border: 4px solid white;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(27, 53, 80, 0.16);
            z-index: 1;
        }
        .slides {
            display: flex;
            width: 400%;
            animation: slide 20s infinite;
            gap: 8px;
        }
        .slides img {
            width: 25%;
            height: 500px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .image-row {
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: clamp(16px, 2vw, 40px);
            display: flex;
            padding-bottom: 34px;
        }
        .image-row img {
            width: 400px;
            height: auto;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 16px 32px rgba(27, 53, 80, 0.14);
        }
        @keyframes slide {
            0% { transform: translateX(0); }
            20% { transform: translateX(0); }
            25% { transform: translateX(-25%); }
            45% { transform: translateX(-25%); }
            50% { transform: translateX(-50%); }
            70% { transform: translateX(-50%); }
            75% { transform: translateX(-75%); }
            95% { transform: translateX(-75%); }
            100% { transform: translateX(0); }
        }
        @media (max-width: 860px) {
            .navbar {
                padding: 16px;
                gap: 16px;
            }
            .navbar-left,
            .navbar-right {
                gap: 10px;
            }
            .brand-name {
                font-size: 18px;
            }
            .slider,
            .slides img {
                height: 320px;
            }
        }
        .sidebar {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 6px;

            border-left: none;
            border-radius: 0 16px 16px 0;
            box-shadow: 8px 0 32px rgba(30, 58, 138, 0.1), inset 1px 0 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateY(-50%) translateX(-20px); }
            to { opacity: 1; transform: translateY(-50%) translateX(0); }
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            text-decoration: none;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            position: relative;
        }
        .sidebar-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 3px;
            height: 60%;
            background: linear-gradient(180deg, #3b82f6, #06b6d4);
            border-radius: 0 4px 4px 0;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-link:hover {
            background: rgba(59, 130, 246, 0.08);
            color: #1e40af;
            transform: translateX(4px);
        }
        .sidebar-link:hover::before {
            transform: translateY(-50%) scaleY(1);
        }
        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(6, 182, 212, 0.08));
            color: #1e40af;
        }
        .sidebar-link.active::before {
            transform: translateY(-50%) scaleY(1);
        }
        .sidebar-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            opacity: 0.75;
            transition: opacity 0.25s ease;
        }
        .sidebar-link:hover .sidebar-icon,
        .sidebar-link.active .sidebar-icon { opacity: 1; }
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 250;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(30, 58, 138, 0.15);
            backdrop-filter: blur(12px);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }
        .sidebar-toggle:hover { transform: scale(1.05); }
        .sidebar-toggle svg { width: 22px; height: 22px; color: #334155; }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 190;
            backdrop-filter: blur(4px);
        }
        @media (max-width: 1024px) {
            .sidebar { transform: translateY(-50%) translateX(-100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
            .sidebar.open { transform: translateY(-50%) translateX(0); }
            .sidebar-toggle { display: flex; }
            .sidebar-overlay.active { display: block; }
        }
    </style>
</head>
