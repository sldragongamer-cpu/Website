<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Unet Solutions</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f4f8 0%, #d1e8f5 25%, #c5dff0 50%, #b8d4eb 75%, #a8cae6 100%);
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 30% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; padding: 16px 32px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.08); z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand img { height: 40px; }
        .brand-name { font-size: 18px; font-weight: 900; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .cart-btn {
            padding: 10px 24px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); }
        .container {
            display: flex; gap: 32px; flex-wrap: wrap; justify-content: center;
            padding: 24px; margin-top: 80px;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .box {
            width: 380px; padding: 36px;
            background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 16px 48px rgba(30, 58, 138, 0.1), 0 4px 12px rgba(30, 58, 138, 0.06);
            backdrop-filter: blur(20px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .box:hover { transform: translateY(-4px); }
        h2 {
            text-align: center; margin-bottom: 28px; font-size: 26px; font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        input {
            width: 100%; padding: 14px 16px; margin: 10px 0;
            border: 2px solid rgba(148, 163, 184, 0.2); border-radius: 14px;
            font-size: 15px; font-family: inherit;
            background: rgba(255, 255, 255, 0.7); color: #1e293b;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input::placeholder { color: #94a3b8; }
        input:focus {
            outline: none; border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            background: white;
        }
        button[type="submit"] {
            width: 100%; padding: 14px; margin-top: 18px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; border: none; border-radius: 14px; cursor: pointer;
            font-size: 16px; font-weight: 700; font-family: inherit;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button[type="submit"]:hover {
            transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }
        button[type="submit"]:active { transform: translateY(0); }
        .status-message { min-height: 20px; margin: 14px 0 0; font-size: 14px; text-align: center; font-weight: 500; }
        .status-message.error { color: #ef4444; }
        .status-message.success { color: #10b981; }
        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; padding: 16px; }
            .box { width: 100%; max-width: 400px; padding: 28px; }
            .top-bar { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
            .brand-name { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="brand">
            <img src="/logo.png" alt="Logo">
            <span class="brand-name">Unet Solutions</span>
        </a>
        <button class="cart-btn">Cart</button>
    </div>
    <div class="container">
        <div class="box">
            <h2>Sign In</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p id="loginMessage" class="status-message" aria-live="polite"></p>
            </form>
        </div>
        <div class="box">
            <h2>Register</h2>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Username" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
                <p id="registerMessage" class="status-message" aria-live="polite"></p>
            </form>
        </div>
    </div>
<script>
  const API_BASE = window.location.port === "5000" ? window.location.origin : "http://localhost:5000";
  const setMessage = (elementId, message, type) => {
    const element = document.getElementById(elementId);
    element.textContent = message;
    element.className = type ? `status-message ${type}` : "status-message";
  };
  const postJson = async (url, payload) => {
    const response = await fetch(`${API_BASE}${url}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const contentType = response.headers.get("content-type") || "";
    if (!contentType.includes("application/json")) throw new Error(`Backend is not responding correctly on ${API_BASE}.`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || data.message || "Request failed.");
    return data;
  };
  const redirectToHome = () => { window.location.href = new URL("../index.html", window.location.href).href; };
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); setMessage("loginMessage", "", "");
    try {
      const data = await postJson("/login", { username: document.getElementById("username").value, password: document.getElementById("password").value });
      if (data.message === "Login successful") { setMessage("loginMessage", "Login successful", "success"); redirectToHome(); } else { setMessage("loginMessage", data.message || "Login failed", "error"); }
    } catch (error) { setMessage("loginMessage", error.message || "Unable to sign in.", "error"); }
  });
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault(); setMessage("registerMessage", "", "");
    const password = document.getElementById("regPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (password !== confirmPassword) { setMessage("registerMessage", "Passwords do not match", "error"); return; }
    try {
      const data = await postJson("/signup", { username: document.getElementById("regUsername").value, email: document.getElementById("regEmail").value, password });
      if (data.message === "User registered successfully") { setMessage("registerMessage", "Sign up successful", "success"); redirectToHome(); } else { setMessage("registerMessage", data.error || data.message || "Sign up failed", "error"); }
    } catch (error) { setMessage("registerMessage", error.message || "Unable to sign up.", "error"); }
  });
</script>
    <script src="/clear-forms.js"></script>
    <script src="/cart.js"></script>
</body>
</html>
