<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Unet Solutions</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f4f8 0%, #d1e8f5 25%, #c5dff0 50%, #b8d4eb 75%, #a8cae6 100%);
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 30% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; padding: 16px 32px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.08); z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand img { height: 40px; }
        .brand-name { font-size: 18px; font-weight: 900; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .cart-btn {
            padding: 10px 24px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); }
        .container {
            display: flex; gap: 32px; flex-wrap: wrap; justify-content: center;
            padding: 24px; margin-top: 80px;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .box {
            width: 380px; padding: 36px;
            background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 16px 48px rgba(30, 58, 138, 0.1), 0 4px 12px rgba(30, 58, 138, 0.06);
            backdrop-filter: blur(20px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .box:hover { transform: translateY(-4px); }
        h2 {
            text-align: center; margin-bottom: 28px; font-size: 26px; font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        input {
            width: 100%; padding: 14px 16px; margin: 10px 0;
            border: 2px solid rgba(148, 163, 184, 0.2); border-radius: 14px;
            font-size: 15px; font-family: inherit;
            background: rgba(255, 255, 255, 0.7); color: #1e293b;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input::placeholder { color: #94a3b8; }
        input:focus {
            outline: none; border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            background: white;
        }
        button[type="submit"] {
            width: 100%; padding: 14px; margin-top: 18px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; border: none; border-radius: 14px; cursor: pointer;
            font-size: 16px; font-weight: 700; font-family: inherit;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button[type="submit"]:hover {
            transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }
        button[type="submit"]:active { transform: translateY(0); }
        .status-message { min-height: 20px; margin: 14px 0 0; font-size: 14px; text-align: center; font-weight: 500; }
        .status-message.error { color: #ef4444; }
        .status-message.success { color: #10b981; }
        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; padding: 16px; }
            .box { width: 100%; max-width: 400px; padding: 28px; }
            .top-bar { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
            .brand-name { font-size: 16px; }
        }
        .sidebar {
            position: fixed; top: 50%; left: 0; transform: translateY(-50%); z-index: 200;
            display: flex; flex-direction: column; gap: 6px; padding: 16px 10px;
            background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.6);
            border-left: none; border-radius: 0 16px 16px 0;
            box-shadow: 8px 0 32px rgba(30, 58, 138, 0.1), inset 1px 0 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateY(-50%) translateX(-20px); }
            to { opacity: 1; transform: translateY(-50%) translateX(0); }
        }
        .sidebar-link {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            text-decoration: none; color: #475569; font-size: 13px; font-weight: 600;
            border-radius: 10px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap; position: relative;
        }
        .sidebar-link::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleY(0);
            width: 3px; height: 60%; background: linear-gradient(180deg, #3b82f6, #06b6d4);
            border-radius: 0 4px 4px 0; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-link:hover { background: rgba(59, 130, 246, 0.08); color: #1e40af; transform: translateX(4px); }
        .sidebar-link:hover::before { transform: translateY(-50%) scaleY(1); }
        .sidebar-link.active { background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(6, 182, 212, 0.08)); color: #1e40af; }
        .sidebar-link.active::before { transform: translateY(-50%) scaleY(1); }
        .sidebar-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.75; transition: opacity 0.25s ease; }
        .sidebar-link:hover .sidebar-icon, .sidebar-link.active .sidebar-icon { opacity: 1; }
        .sidebar-toggle {
            display: none; position: fixed; top: 20px; left: 20px; z-index: 250;
            width: 44px; height: 44px; background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 12px;
            box-shadow: 0 4px 16px rgba(30, 58, 138, 0.15); backdrop-filter: blur(12px);
            cursor: pointer; align-items: center; justify-content: center; transition: all 0.25s ease;
        }
        .sidebar-toggle:hover { transform: scale(1.05); }
        .sidebar-toggle svg { width: 22px; height: 22px; color: #334155; }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3);
            z-index: 190; backdrop-filter: blur(4px);
        }
        @media (max-width: 1024px) {
            .sidebar { transform: translateY(-50%) translateX(-100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
            .sidebar.open { transform: translateY(-50%) translateX(0); }
            .sidebar-toggle { display: flex; }
            .sidebar-overlay.active { display: block; }
        }
    </style>
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar" id="sidebar">
        <a href="/" class="sidebar-link">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
            Home
        </a>
        <a href="/laptops" class="sidebar-link">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"/></svg>
            Laptops
        </a>
        <a href="/pc" class="sidebar-link">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3m3 3a3 3 0 1 0 0 6h13.5a3 3 0 1 0 0-6m-16.5-3a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3m-19.5 0a4.5 4.5 0 0 1 .9-2.7L5.737 5.4a3 3 0 0 1 2.4-1.2h7.726a3 3 0 0 1 2.4 1.2l1.637 2.15a4.5 4.5 0 0 1 .9 2.7"/></svg>
            PC
        </a>
        <a href="/gaming" class="sidebar-link">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
            Gaming
        </a>
        <a href="/monitor" class="sidebar-link">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"/></svg>
            Monitors
        </a>
        <a href="/build pc" class="sidebar-link">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.426 2.426 0 0 1-3.436 0 2.426 2.426 0 0 1 0-3.436l4.654-4.654m0-7.192 4.654-4.654a2.426 2.426 0 0 1 3.436 0 2.426 2.426 0 0 1 0 3.436L12 12m-.586-7.192L5.25 10.964M6.75 3H3"/></svg>
            Build PC
        </a>
        <a href="/login" class="sidebar-link active">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg>
            Login
        </a>
        <a href="/#contact" class="sidebar-link">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/></svg>
            Contact
        </a>
    </nav>
    <div class="top-bar">
        <a href="/" class="brand">
            <img src="/logo.png" alt="Logo">
            <span class="brand-name">Unet Solutions</span>
        </a>
        <button class="cart-btn">Cart</button>
    </div>
    <div class="container">
        <div class="box">
            <h2>Sign In</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p id="loginMessage" class="status-message" aria-live="polite"></p>
            </form>
        </div>
        <div class="box">
            <h2>Register</h2>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Username" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
                <p id="registerMessage" class="status-message" aria-live="polite"></p>
            </form>
        </div>
    </div>
<script>
  const API_BASE = window.location.port === "5000" ? window.location.origin : "http://localhost:5000";
  const setMessage = (elementId, message, type) => {
    const element = document.getElementById(elementId);
    element.textContent = message;
    element.className = type ? `status-message ${type}` : "status-message";
  };
  const postJson = async (url, payload) => {
    const response = await fetch(`${API_BASE}${url}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const contentType = response.headers.get("content-type") || "";
    if (!contentType.includes("application/json")) throw new Error(`Backend is not responding correctly on ${API_BASE}.`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || data.message || "Request failed.");
    return data;
  };
  const redirectToHome = () => { window.location.href = new URL("../index.html", window.location.href).href; };
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); setMessage("loginMessage", "", "");
    try {
      const data = await postJson("/login", { username: document.getElementById("username").value, password: document.getElementById("password").value });
      if (data.message === "Login successful") { setMessage("loginMessage", "Login successful", "success"); redirectToHome(); } else { setMessage("loginMessage", data.message || "Login failed", "error"); }
    } catch (error) { setMessage("loginMessage", error.message || "Unable to sign in.", "error"); }
  });
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault(); setMessage("registerMessage", "", "");
    const password = document.getElementById("regPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (password !== confirmPassword) { setMessage("registerMessage", "Passwords do not match", "error"); return; }
    try {
      const data = await postJson("/signup", { username: document.getElementById("regUsername").value, email: document.getElementById("regEmail").value, password });
      if (data.message === "User registered successfully") { setMessage("registerMessage", "Sign up successful", "success"); redirectToHome(); } else { setMessage("registerMessage", data.error || data.message || "Sign up failed", "error"); }
    } catch (error) { setMessage("registerMessage", error.message || "Unable to sign up.", "error"); }
  });
</script>
    <script src="/clear-forms.js"></script>
    <script src="/cart.js"></script>
    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        sidebarToggle?.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        });
        sidebarOverlay?.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        });
    </script>
</body>
</html>
