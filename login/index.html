        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-primary); overflow-x: hidden; }
    </style>
</head>
<body>
    <div class="page-wrapper login-page">
        <div class="navbar">
            <div class="navbar-left">
                <a href="/index.html" class="brand-mark">
                    <img src="/logo.png" alt="Logo">

                                <a href="/peripherals/mousekb.html">Mouse & Keyboard</a>

                                <a href="/peripherals/ram.html">Desktop RAM</a>

                            </div>

                    </div>
                </div>
                <a href="#contact" class="nav-link">Contact</a>
            </div>
            <div class="navbar-right">
                <span class="icon-btn">Search</span>
                <a href="/login/index.html" class="icon-btn">Account</a>

    <div class="container" style="max-width:900px; padding:60px 24px; display:flex; justify-content:center; align-items:center; gap:40px; flex-wrap:wrap; min-height:60vh;">
        <div class="box" style="background:var(--bg-card); border:1px solid var(--border-glow); border-radius:24px; padding:40px; width:100%; max-width:420px; box-shadow:0 0 40px rgba(0,240,255,0.1); backdrop-filter:blur(24px); position:relative; overflow:hidden;">
            <div style="position:absolute; top:0; left:0; width:100%; height:2px; background:linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-magenta), transparent);"></div>
            <h2 style="font-size:28px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:28px; text-align:center; background:linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">Sign In</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                <input type="password" id="password" placeholder="Password" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                <button type="submit" style="width:100%; padding:16px; background:linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); color:#0a0a1a; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; font-family:inherit; box-shadow:0 0 20px rgba(0,240,255,0.3); transition:all 0.25s ease; margin-top:8px;">Login</button>
                <p id="loginMessage" class="status-message" aria-live="polite" style="text-align:center; margin-top:12px; font-size:13px; font-weight:600; padding:8px 12px; border-radius:8px;"></p>
            </form>
        </div>
        <div class="box" style="background:var(--bg-card); border:1px solid var(--border-glow); border-radius:24px; padding:40px; width:100%; max-width:420px; box-shadow:0 0 40px rgba(0,240,255,0.1); backdrop-filter:blur(24px); position:relative; overflow:hidden;">
            <div style="position:absolute; top:0; left:0; width:100%; height:2px; background:linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-magenta), transparent);"></div>
            <h2 style="font-size:28px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:28px; text-align:center; background:linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">Register</h2>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Username" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                <input type="email" id="regEmail" placeholder="Email" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                <input type="password" id="regPassword" placeholder="Password" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                <button type="submit" style="width:100%; padding:16px; background:linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); color:#0a0a1a; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; font-family:inherit; box-shadow:0 0 20px rgba(0,240,255,0.3); transition:all 0.25s ease; margin-top:8px;">Sign Up</button>
                <p id="registerMessage" class="status-message" aria-live="polite" style="text-align:center; margin-top:12px; font-size:13px; font-weight:600; padding:8px 12px; border-radius:8px;"></p>
            </form>
        </div>
    </div>
    </div>
<script>
  const API_BASE = window.location.port === "5000" ? window.location.origin : "http://localhost:5000";
  const setMessage = (elementId, message, type) => {
    const element = document.getElementById(elementId);
    element.textContent = message;
    element.className = type ? `status-message ${type}` : "status-message";
  };
  const postJson = async (url, payload) => {
    const response = await fetch(`${API_BASE}${url}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const contentType = response.headers.get("content-type") || "";
    if (!contentType.includes("application/json")) throw new Error(`Backend is not responding correctly on ${API_BASE}.`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || data.message || "Request failed.");
    return data;
  };
  const redirectToHome = () => { window.location.href = new URL("../index.html", window.location.href).href; };
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); setMessage("loginMessage", "", "");
    try {
      const data = await postJson("/login", { username: document.getElementById("username").value, password: document.getElementById("password").value });
      if (data.message === "Login successful") { setMessage("loginMessage", "Login successful", "success"); redirectToHome(); } else { setMessage("loginMessage", data.message || "Login failed", "error"); }
    } catch (error) { setMessage("loginMessage", error.message || "Unable to sign in.", "error"); }
  });
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault(); setMessage("registerMessage", "", "");
    const password = document.getElementById("regPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (password !== confirmPassword) { setMessage("registerMessage", "Passwords do not match", "error"); return; }
    try {
      const data = await postJson("/signup", { username: document.getElementById("regUsername").value, email: document.getElementById("regEmail").value, password });
      if (data.message === "User registered successfully") { setMessage("registerMessage", "Sign up successful", "success"); redirectToHome(); } else { setMessage("registerMessage", data.error || data.message || "Sign up failed", "error"); }
    } catch (error) { setMessage("registerMessage", error.message || "Unable to sign up.", "error"); }
  });
</script>
    <script src="/clear-forms.js"></script>
    <script src="/cart.js"></script>
    <script src="/dropdown-fix.js"></script><script src="../navbar.js"></script>\n</body>
</html>
