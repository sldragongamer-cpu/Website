<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Unet Solutions | Gaming</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #d1e8f5 25%, #c5dff0 50%, #b8d4eb 75%, #a8cae6 100%);
            color: #0f172a; min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }
        .page-wrapper { position: relative; z-index: 1; }
        .navbar {
            position: relative; width: min(1400px, calc(100% - 48px));
            min-height: 80px; margin: 24px auto 32px; padding: 0 28px;
            background: rgba(255, 255, 255, 0.82);
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 20px;
            box-shadow: 0 8px 32px rgba(30, 58, 138, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(180%); box-sizing: border-box; z-index: 100;
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .navbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .brand-mark { display: flex; align-items: center; gap: 14px; text-decoration: none; padding-right: 20px; margin-right: 8px; border-right: 1px solid rgba(148, 163, 184, 0.2); }
        .brand-mark img { height: 48px; width: auto; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .brand-mark:hover img { transform: scale(1.05) rotate(-2deg); }
        .brand-name {
            font-size: 20px; font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-link { color: #334155; text-decoration: none; font-size: 15px; font-weight: 600; padding: 10px 18px; border-radius: 12px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); background: transparent; }
        .nav-link:hover { color: #1e40af; background: rgba(59, 130, 246, 0.06); }
        .dropdown { position: relative; display: inline-flex; align-items: center; }
        .dropdown > button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; cursor: pointer; font: inherit; background: transparent; color: #334155; font-size: 15px; font-weight: 600; padding: 10px 18px; border-radius: 12px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .dropdown:hover > button { color: #1e40af; background: rgba(59, 130, 246, 0.06); }
        .dropdown-content { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-8px); position: absolute; top: calc(100% + 12px); left: 0; min-width: 200px; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 16px; box-shadow: 0 20px 50px rgba(30, 58, 138, 0.12); padding: 8px; z-index: 9999; backdrop-filter: blur(20px); transition: opacity 0.2s ease 0.3s, visibility 0.2s ease 0.3s, transform 0.2s ease 0.3s; }
        .dropdown-content::before { content: ''; position: absolute; top: -20px; left: 0; width: 100%; height: 20px; background: transparent; }
        .dropdown-content a { display: block; padding: 12px 16px; border-radius: 10px; text-decoration: none; color: #1e293b; font-weight: 600; font-size: 14px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .dropdown-content a:hover { background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(6, 182, 212, 0.06)); color: #1e40af; padding-left: 20px; }
        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); transition-delay: 0s; }
        .navbar-right { display: flex; align-items: center; gap: 10px; }
        .icon-btn { display: inline-flex; justify-content: center; align-items: center; min-width: 42px; height: 42px; padding: 0 20px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .icon-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); }
        .content { max-width: 800px; margin: 60px auto; padding: 0 24px; text-align: center; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 40px; font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 32px; }
        .coming-soon {
            background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 60px 40px; border-radius: 24px;
            box-shadow: 0 16px 48px rgba(30, 58, 138, 0.1);
            backdrop-filter: blur(16px);
        }
        .coming-soon p:first-child { font-size: 72px; margin: 0 0 16px; }
        .coming-soon p:nth-child(2) { font-size: 24px; font-weight: 700; margin: 16px 0; color: #1e293b; }
        .coming-soon p:last-child { color: #64748b; font-size: 16px; }
        @media (max-width: 860px) {
            .navbar { flex-direction: column; padding: 20px; gap: 16px; margin: 16px auto 24px; width: calc(100% - 32px); }
            .navbar-left, .navbar-right { gap: 8px; justify-content: center; flex-wrap: wrap; }
            .brand-mark { border-right: none; padding-right: 0; margin-right: 0; }
            .brand-name { font-size: 18px; }
            h1 { font-size: 28px; }
            .coming-soon { padding: 40px 24px; }
        }
        .sidebar {
            position: fixed; top: 50%; left: 0; transform: translateY(-50%); z-index: 200;
            display: flex; flex-direction: column; gap: 6px; padding: 16px 10px;
            background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.6);
            border-left: none; border-radius: 0 16px 16px 0;
            box-shadow: 8px 0 32px rgba(30, 58, 138, 0.1), inset 1px 0 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateY(-50%) translateX(-20px); }
            to { opacity: 1; transform: translateY(-50%) translateX(0); }
        }
        .sidebar-link {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            text-decoration: none; color: #475569; font-size: 13px; font-weight: 600;
            border-radius: 10px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap; position: relative;
        }
        .sidebar-link::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleY(0);
            width: 3px; height: 60%; background: linear-gradient(180deg, #3b82f6, #06b6d4);
            border-radius: 0 4px 4px 0; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-link:hover { background: rgba(59, 130, 246, 0.08); color: #1e40af; transform: translateX(4px); }
        .sidebar-link:hover::before { transform: translateY(-50%) scaleY(1); }
        .sidebar-link.active { background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(6, 182, 212, 0.08)); color: #1e40af; }
        .sidebar-link.active::before { transform: translateY(-50%) scaleY(1); }
        .sidebar-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.75; transition: opacity 0.25s ease; }
        .sidebar-link:hover .sidebar-icon, .sidebar-link.active .sidebar-icon { opacity: 1; }
        .sidebar-toggle {
            display: none; position: fixed; top: 20px; left: 20px; z-index: 250;
            width: 44px; height: 44px; background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 12px;
            box-shadow: 0 4px 16px rgba(30, 58, 138, 0.15); backdrop-filter: blur(12px);
            cursor: pointer; align-items: center; justify-content: center; transition: all 0.25s ease;
        }
        .sidebar-toggle:hover { transform: scale(1.05); }
        .sidebar-toggle svg { width: 22px; height: 22px; color: #334155; }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3);
            z-index: 190; backdrop-filter: blur(4px);
        }
        @media (max-width: 1024px) {
            .sidebar { transform: translateY(-50%) translateX(-100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
            .sidebar.open { transform: translateY(-50%) translateX(0); }
            .sidebar-toggle { display: flex; }
            .sidebar-overlay.active { display: block; }
        }
    </style>
</head>
<body>

        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>

            Gaming
        </a>
        <a href="/monitor" class="sidebar-link">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"/></svg>

            Contact

<div class="page-wrapper">
    <div class="navbar">
        <div class="navbar-left">
            <a href="../index.html" class="brand-mark">
                <img src="/logo.png" alt="Logo">
                <span class="brand-name">Unet Solutions</span>

    <div class="content">

        <div class="coming-soon">

            <p>We're working on adding gaming products!</p>
            <p>Stay tuned for keyboards, mice, headsets, and more.</p>
        </div>
    </div>
</div>
    <script src="/clear-forms.js"></script>
    <script src="/cart.js"></script>
    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        sidebarToggle?.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        });
        sidebarOverlay?.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        });
    </script>
</body>
