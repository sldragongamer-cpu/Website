    <link rel="stylesheet" href="/gamer-theme.css">

</head>
<body>
    <div class="page-wrapper signup-page">
        <div class="navbar">
            <div class="navbar-left">
                <a href="/index.html" class="brand-mark">
                    <img src="/logo.png" alt="Logo">
                    <span class="brand-name">Unet Solutions</span>
                </a>
                <a href="/index.html" class="nav-link">Home</a>
                <div class="dropdown">
                    <button type="button">Categories ▼</button>
                    <div class="dropdown-content">
                        <a href="/laptops">Laptops</a>
                        <a href="/pc">PC</a>
                        <a href="/gaming">Gaming</a>
                        <a href="/monitor">Monitor</a>
                        <div class="dropdown">
                            <a href="/peripherals">Peripherals ▼</a>
                            <div class="dropdown-content">
                                <a href="/peripherals/webcam.html">Webcam</a>
                                <a href="/peripherals/mousekb.html">Mouse & Keyboard</a>
                                <a href="/peripherals/psu.html">Power Supply</a>
                                <a href="/peripherals/casing.html">Casings</a>
                                <a href="/peripherals/cooler.html">Coolers</a>
                                <a href="/peripherals/processor.html">Processors</a>
                                <a href="/peripherals/mobo.html">Motherboard</a>
                                <a href="/peripherals/ram.html">Desktop RAM</a>
                                <a href="/peripherals/vga.html">VGA Card</a>
                                <a href="/peripherals/sound.html">Sound Card</a>
                            </div>
                        </div>
                        <a href="/build-pc">Build PC</a>
                    </div>
                </div>
                <a href="#contact" class="nav-link">Contact</a>
            </div>
            <div class="navbar-right">
                <span class="icon-btn">Search</span>
                <a href="/login/index.html" class="icon-btn">Account</a>
                <span class="icon-btn" id="cartToggle">Cart</span>
            </div>
        </div>

        <div class="container" style="display:flex; justify-content:center; align-items:center; padding:40px 24px; min-height:60vh;">
            <div class="box" style="background:var(--bg-card); border:1px solid var(--border-glow); border-radius:24px; padding:40px; width:100%; max-width:420px; box-shadow:0 0 40px rgba(0,240,255,0.1); backdrop-filter:blur(24px); position:relative; overflow:hidden;">
                <div style="position:absolute; top:0; left:0; width:100%; height:2px; background:linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-magenta), transparent);"></div>
                <h2 style="font-size:28px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:28px; text-align:center; background:linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">Sign Up</h2>
                <form id="registerForm">
                    <input type="text" id="regUsername" placeholder="Username" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                    <input type="email" id="regEmail" placeholder="Email" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                    <input type="password" id="regPassword" placeholder="Password" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required style="width:100%; padding:14px 16px; margin-bottom:16px; background:rgba(0,240,255,0.03); border:1px solid rgba(0,240,255,0.15); border-radius:12px; color:var(--text-primary); font-size:15px; font-weight:500; outline:none; font-family:inherit; transition:all 0.25s ease; box-sizing:border-box;">
                    <button type="submit" style="width:100%; padding:16px; background:linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); color:#0a0a1a; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; font-family:inherit; box-shadow:0 0 20px rgba(0,240,255,0.3); transition:all 0.25s ease; margin-top:8px;">Sign Up</button>
                    <p id="registerMessage" class="status-message" aria-live="polite" style="text-align:center; margin-top:12px; font-size:13px; font-weight:600; padding:8px 12px; border-radius:8px;"></p>
                    <a href="/login/" class="login-link" style="display:block; text-align:center; margin-top:16px; color:var(--text-dim); font-size:14px; text-decoration:none; transition:color 0.25s ease;">Already have an account? Sign In</a>
                </form>
            </div>
        </div>
    </div>

    <script>
      const API_BASE =
        window.location.port === "5000" ? window.location.origin : "http://localhost:5000";

      const setMessage = (message, type) => {
        const element = document.getElementById("registerMessage");
        element.textContent = message;
        element.className = `status-message ${type}`;
      };

      const postJson = async (url, payload) => {
        const response = await fetch(`${API_BASE}${url}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const contentType = response.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          throw new Error(`Backend is not responding correctly on ${API_BASE}.`);
        }

        let data = {};
        try {
          data = await response.json();
        } catch (error) {
          throw new Error("Server returned an invalid response.");
        }

        if (!response.ok) {
          throw new Error(data.error || data.message || "Request failed.");
        }

        return data;
      };

      document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        setMessage("", "");
        const password = document.getElementById("regPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        if (password !== confirmPassword) {
          setMessage("Passwords do not match", "error");
          return;
        }
        try {
          const data = await postJson("/signup", {
            username: document.getElementById("regUsername").value,
            email: document.getElementById("regEmail").value,
            password
          });

          if (data.message === "User registered successfully") {
            setMessage("Sign up successful", "success");
            setTimeout(() => {
              window.location.href = new URL("../login/index.html", window.location.href).href;
            }, 1000);
          } else {
            setMessage(data.error || data.message || "Sign up failed", "error");
          }
        } catch (error) {
          setMessage(error.message || `Unable to sign up. Check that ${API_BASE} is running.`, "error");
        }
      });
    </script>
    <script src="/clear-forms.js"></script>
    <script src="/cart.js"></script>
    \n<script src="../navbar.js"></body>
</html>
